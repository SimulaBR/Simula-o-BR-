# Robô separador do SimulaBr: abre os pacotes .zip enviados para a raiz do repositório,
# coloca cada arquivo no lugar certo (mantendo as pastas), apaga o zip e faz o commit.
# Vale para arquivos chamados pacote-QUALQUERNOME.zip ou SimulaBr_QUALQUERNOME.zip
# Também leva o lanternas-ajustes.json (exportado no painel de lanternas) para modelos/lanternas/ajustes.json
# Depois de salvar, pede ao GitHub para publicar o site de novo.

name: Robô separador

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: robo-separador
  cancel-in-progress: false

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Abrir os pacotes
        id: abrir
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pacotes=(pacote-*.zip SimulaBr_*.zip)
          ajustes=(lanternas-ajustes*.json)
          if [ ${#pacotes[@]} -eq 0 ] && [ ${#ajustes[@]} -eq 0 ]; then
            echo "Nenhum pacote encontrado. Nada a fazer."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for z in "${pacotes[@]}"; do
            echo "Abrindo $z"
            unzip -o -q "$z" -d .
            git rm -q --cached "$z" || true
            rm -f "$z"
          done
          # o mais novo vale (o celular pode ter baixado como "lanternas-ajustes (1).json")
          if [ ${#ajustes[@]} -gt 0 ]; then
            mkdir -p modelos/lanternas
            novo=$(ls -t "${ajustes[@]}" | head -1)
            echo "Lanternas: $novo"
            cp "$novo" modelos/lanternas/ajustes.json
            for a in "${ajustes[@]}"; do git rm -q --cached "$a" || true; rm -f "$a"; done
          fi
          # o ônibus antigo da raiz virou modelos/onibus/rodoviario_classico.glb
          if [ -f modelos/onibus/rodoviario_classico.glb ] && [ -f onibus.glb ]; then git rm -q onibus.glb; fi
          echo "mudou=sim" >> "$GITHUB_OUTPUT"

      - name: Salvar no repositório
        if: steps.abrir.outputs.mudou == 'sim'
        shell: bash
        run: |
          git config user.name "Robô separador"
          git config user.email "robo-separador@users.noreply.github.com"
          git add -A
          git commit -m "Robô separador: pacotes abertos" || echo "Nada para salvar"
          git push

      - name: Publicar o site
        if: steps.abrir.outputs.mudou == 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
